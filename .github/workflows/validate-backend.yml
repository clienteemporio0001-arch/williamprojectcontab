name: Validar funções Supabase
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/validate-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar TypeScript das funções sem executar envios
        run: deno check supabase/functions/_shared/billing_pdf.ts supabase/functions/generate-charge/index.ts supabase/functions/dispatch-reminders/index.ts supabase/functions/whatsapp-connect/index.ts supabase/functions/whatsapp-webhook/index.ts
      - name: Testar geração do PDF em Deno
        run: deno test supabase/functions/_shared/billing_pdf_test.ts
