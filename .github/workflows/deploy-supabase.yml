name: Publicar funções Supabase (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: supabase-pilot
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN e SUPABASE_PROJECT_ID nos Secrets do ambiente supabase-pilot."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar geração de cobranças
        run: supabase functions deploy generate-charge --project-ref "$PROJECT_ID" --use-api
      - name: Publicar agendador (sem ativar cron)
        run: supabase functions deploy dispatch-reminders --project-ref "$PROJECT_ID" --no-verify-jwt --use-api
      - name: Publicar conexão WhatsApp por escritório
        run: supabase functions deploy whatsapp-connect --project-ref "$PROJECT_ID" --no-verify-jwt --use-api
      - name: Publicar webhook Meta
        run: supabase functions deploy whatsapp-webhook --project-ref "$PROJECT_ID" --no-verify-jwt --use-api
