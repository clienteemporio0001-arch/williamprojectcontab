name: Publicar demonstração Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types scripts/smoke-pdf.mjs
      - run: node --experimental-strip-types scripts/test-registration.mjs
      - run: node --experimental-strip-types scripts/test-plan-prices.mjs
      - run: node --experimental-strip-types scripts/test-trial.mjs
      - name: Validar configurações públicas do Supabase
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltam as duas Repository Variables do Supabase. Impedindo a publicação de uma demo por engano."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::VITE_SUPABASE_URL não é uma URL Supabase válida."; exit 1 ;;
          esac
          case "$VITE_SUPABASE_ANON_KEY" in
            sb_publishable_*|eyJ*) ;;
            *) echo "::error::VITE_SUPABASE_ANON_KEY deve ser a chave pública Publishable ou anon."; exit 1 ;;
          esac
          echo "Configurações públicas encontradas. Não serão exibidos seus valores."
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_META_APP_ID: ${{ vars.VITE_META_APP_ID || '1361054859259161' }}
          VITE_META_CONFIG_ID: ${{ vars.VITE_META_CONFIG_ID || '1135561272195135' }}
      - name: Validar identificadores públicos da Meta no build
        run: |
          grep -RqF '1361054859259161' dist/assets || { echo "::error::Meta App ID não foi incorporado ao build."; exit 1; }
          grep -RqF '1135561272195135' dist/assets || { echo "::error::Meta Configuration ID não foi incorporado ao build."; exit 1; }
          echo "Identificadores Meta presentes no build."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
